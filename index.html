<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER / GREETING ===== -->
  <header class="header">
    <div class="header-left">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Senin, 1 Januari 2025</div>
      <div id="greeting" class="greeting">Selamat pagi!</div>
    </div>
    <div class="header-right">
      <button id="btn-set-name" class="btn btn-ghost" title="Ubah nama">✏️ Nama</button>
      <button id="btn-theme" class="btn btn-ghost" title="Ganti tema">🌙 Tema</button>
    </div>
  </header>

  <!-- ===== MODAL: SET NAME ===== -->
  <div id="modal-name" class="modal-overlay hidden">
    <div class="modal">
      <h3>Siapa namamu?</h3>
      <input id="input-name" type="text" class="input" placeholder="Masukkan namamu..." maxlength="30" />
      <div class="modal-actions">
        <button id="btn-save-name" class="btn btn-primary">Simpan</button>
        <button id="btn-cancel-name" class="btn btn-ghost">Batal</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN GRID ===== -->
  <main class="grid">

    <!-- === FOCUS TIMER === -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary">▶ Mulai</button>
        <button id="btn-stop" class="btn btn-secondary">⏸ Berhenti</button>
        <button id="btn-reset" class="btn btn-ghost">↺ Reset</button>
      </div>
      <div class="timer-duration-row">
        <label for="timer-minutes">Durasi (menit):</label>
        <input id="timer-minutes" type="number" class="input input-sm" min="1" max="120" value="25" />
        <button id="btn-set-duration" class="btn btn-sm btn-ghost">Set</button>
      </div>
    </section>

    <!-- === TO-DO LIST === -->
    <section class="card todo-card">
      <h2 class="card-title">📝 To-Do List</h2>
      <div class="todo-input-row">
        <input id="todo-input" type="text" class="input" placeholder="Tambah tugas baru..." maxlength="100" />
        <button id="btn-add-todo" class="btn btn-primary">+ Tambah</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-hint">Belum ada tugas. Yuk mulai! 🚀</p>
    </section>

    <!-- === QUICK LINKS === -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Tautan Cepat</h2>
      <div class="links-input-row">
        <input id="link-label" type="text" class="input" placeholder="Label (cth: YouTube)" maxlength="30" />
        <input id="link-url" type="url" class="input" placeholder="URL (cth: https://...)" />
        <button id="btn-add-link" class="btn btn-primary">+ Tambah</button>
      </div>
      <div id="links-grid" class="links-grid"></div>
      <p id="links-empty" class="empty-hint">Belum ada tautan tersimpan.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
